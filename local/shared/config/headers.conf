# Local-only CSP: allow inline scripts for Symfony Web Debug Toolbar and page scripts.
# Hosted environments keep docker/etc/nginx/custom/headers.conf (stricter script-src-elem).
add_header Content-Security-Policy "worker-src 'self' blob:; connect-src 'self' https://*.awswaf.com; script-src 'self' 'unsafe-inline' https://*.awswaf.com; script-src-elem 'self' 'unsafe-inline' https://*.awswaf.com; img-src 'self' data: https:; font-src https: fonts.googleapis.com; upgrade-insecure-requests";

# add_header Referrer-Policy "strict-origin-when-cross-origin";
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload; always;";
# add_header X-Content-Options "nosniff";
# add_header X-XSS-Protection "1; mode=block";

# Remove un-security headers :-)
more_clear_headers X-Powered-By;
